<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор лабиринтов</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Генератор лабиринтов</h1>
        <div class="controls">
            <div class="input-group">
                <label for="width">Ширина лабиринта:</label>
                <input type="number" id="width" value="21" min="5" max="51" step="2">
            </div>

            <div class="input-group">
                <label for="height">Высота лабиринта:</label>
                <input type="number" id="height" value="21" min="5" max="51" step="2">
            </div>

            <div class="input-group">
                <label>Алгоритм генерации:</label>
                <select id="algorithm">
                </select>
            </div>
            <div class="input-group">
                <input type="checkbox" id="braid" name="braid">
                <label for="braid">Braiding (без тупиков)</label>
            </div>

            <button id="generateBtn">Сгенерировать лабиринт</button>
        </div>
        <div class="game-stats">
            <div id="stepCounter">Шаги: 0</div>
            <div id="timer">Время: 0.0 c</div>
            <button id="resetBtn" class="reset-btn">Вернуться в начало</button>
            <button id="resetCheckPointBtn" class="reset-btn">Вернуться в контрольную точку</button>
            <button id="checkPointBtn" class="reset-btn">Сохранить контрольную точку</button>
        </div>
        <div class="leaderboard-section">
    <h2>Таблица лидеров</h2>
        <div id="leaderboard" class="leaderboard">
                <p>Пока нет записей</p>
            </div>
            
            <div class="saved-mazes-list">
                <h3>Сохраненные лабиринты</h3>
                <div id="savedMazesContainer">
                </div>
            </div>
            
            <button id="clearLeaderboard" class="control-btn">Очистить таблицу</button>
        </div>
        <div id = "tableWithLeader">
            <div id="mazeContainer"></div>
            
        </div>
        <!-- Модальное окно победы -->
<div id="winModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Поздравляем!</h2>
            <button class="close-modal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Ваш результат</h3>
                    <div class="stat-value" id="winSteps">0</div>
                    <div class="stat-label">Шагов</div>
                </div>
                <div class="stat-card">
                    <h3>Оптимальный путь</h3>
                    <div class="stat-value" id="winOptimal">0</div>
                    <div class="stat-label">Шагов</div>
                </div>
                <div class="stat-card">
                    <h3>Время</h3>
                    <div class="stat-value" id="winTime">0.0</div>
                    <div class="stat-label">Секунд</div>
                </div>
            </div>
            
            <div class="efficiency">
                <h4>Эффективность</h4>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="efficiencyBar"></div>
                    </div>
                    <div class="progress-text" id="efficiencyText">0%</div>
                </div>
            </div>
            
            <div class="modal-buttons">
                <button id="showOptimalPath" class="modal-btn primary">
                    Показать оптимальный путь
                </button>
                <button id="hideOptimalPath" class="modal-btn secondary" style="display: none;">
                    Скрыть путь
                </button>
                <button id="playAgain" class="modal-btn success">
                    Играть еще
                </button>
            </div>
            
            <div class="path-info" id="pathInfo">
                <h4>Детали маршрута</h4>
                <div id="pathDetails"></div>
            </div>
        </div>
        <!-- Добавьте эту кнопку рядом с другими кнопками управления -->
    </div>
</div>

    </div>
</body>
</html>
