<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Дерево черт PF2e</title>
    <link href="fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Холст дерева -->
    <div id="viewport" tabindex="0" aria-label="Дерево черт">
        <div id="world">
            <svg id="rings-layer" width="1" height="1" aria-hidden="true"></svg>
            <!-- линии «Текущий уровень» в обеих половинах дерева (позицию ставит app.js) -->
            <div id="level-lines" aria-hidden="true"></div>
            <svg id="edges-layer" width="1" height="1" aria-hidden="true"></svg>
            <div id="nodes-layer"></div>
        </div>
    </div>

    <!-- Шапка (закреплена сверху): класс (выпадающий список), перевод, уровень, действия со сборкой -->
    <header id="app-header">
        <button id="panel-toggle" class="icon-btn" title="Свернуть панель" aria-label="Свернуть панель">‹</button>
        <div class="crest" aria-hidden="true"></div>
        <div class="hdr-title">
            <div class="class-pick">
                <button type="button" id="class-btn" class="class-btn" aria-haspopup="true" aria-expanded="false" aria-controls="class-menu" title="Выбрать класс">
                    <h1 id="class-name">Поборник</h1><span class="class-caret" aria-hidden="true"></span>
                </button>
                <nav id="class-menu" class="class-menu frame" aria-label="Класс" hidden></nav>
            </div>
            <div class="hdr-sub">дерево классовых черт · PF2e <span id="class-note" class="class-note"></span></div>
        </div>
        <!-- Перевод текстов: AoN / pf2.ru / Док и Юра (кнопки строит app.js, если у класса есть переводы) -->
        <div id="lang-switch" class="lang-switch" role="radiogroup" aria-label="Перевод" hidden></div>
        <!-- уровень персонажа: число 1–20, стрелки рядом и ↑/↓ на клавиатуре -->
        <div class="hdr-level">
            <label for="level">Уровень</label>
            <div class="stepper">
                <button type="button" class="step-btn" data-step="-1" title="Уровень ниже" aria-label="Уровень ниже">▼</button>
                <input id="level" type="number" min="1" max="20" step="1" value="1" inputmode="numeric" aria-label="Уровень персонажа">
                <button type="button" class="step-btn" data-step="1" title="Уровень выше" aria-label="Уровень выше">▲</button>
            </div>
        </div>
        <div class="hdr-actions">
            <button type="button" id="btn-share" class="btn" title="Скопировать ссылку на эту сборку">Экспорт</button>
            <button type="button" id="btn-reset" class="btn btn-danger" data-reset title="Сбросить сборку (Ctrl+Z — отменить)">Сброс</button>
            <button type="button" id="btn-fit" class="btn" title="Показать всё дерево (клавиша 0)">Центрировать</button>
        </div>
    </header>

    <!-- Левая панель: сборка -->
    <aside id="panel">
        <div class="panel-body">
            <!-- Группы выбора класса (школа и диссертация волшебника, освящение и призвание поборника…) -->
            <div id="choice-groups" aria-label="Выбор при создании персонажа"></div>

            <section class="block" data-sec-block="feats">
                <h2 class="sec-head"><button type="button" class="sec-toggle" data-sec="feats" aria-expanded="true"><span>Черты</span> <span id="feat-count" class="muted"></span><span class="nav-sign" aria-hidden="true"></span></button></h2>
                <ol id="feat-list" class="feat-list"></ol>
                <p id="feat-empty" class="muted small">Пока ничего не выбрано.</p>
            </section>

            <section class="block" data-sec-block="search">
                <h2 class="sec-head"><button type="button" class="sec-toggle" data-sec="search" aria-expanded="true"><span>Поиск и фильтры</span><span class="nav-sign" aria-hidden="true"></span></button></h2>
                <input id="search" type="search" placeholder="Название черты…" autocomplete="off">
                <div class="filters">
                    <label data-filter="uncommon"><input type="checkbox" id="f-uncommon" checked> необычные</label>
                    <label data-filter="unholy"><input type="checkbox" id="f-unholy" checked> нечестивые</label>
                    <label><input type="checkbox" id="f-avail"> только доступные</label>
                </div>
            </section>
        </div>

        <footer class="panel-foot small muted" id="data-source"></footer>
    </aside>

    <!-- Правая панель: подробности -->
    <aside id="details" class="frame hidden" aria-live="polite">
        <button id="details-close" class="icon-btn" aria-label="Закрыть">✕</button>
        <div id="details-content"></div>
    </aside>

    <!-- Всплывающая подсказка -->
    <div id="tooltip" class="tooltip hidden" role="tooltip"></div>
    <div id="toast" class="toast hidden"></div>
    <!-- Компактная легенда: состояния узлов и виды связей -->
    <details id="map-legend" class="frame" open>
        <summary>Легенда</summary>
        <ul>
            <li><span class="lg-node lg-on"></span>взято</li>
            <li><span class="lg-node lg-avail"></span>можно взять</li>
            <li><span class="lg-node lg-locked"><span class="lock-badge"></span></span>закрыто</li>
            <li><span class="lg lg-req"></span>обязательное условие</li>
            <li><span class="lg lg-or"></span>одно из условий (или)</li>
            <li><span class="lg lg-taken"></span>путь к взятым</li>
        </ul>
    </details>
    <div id="zoom-ctl">
        <button class="icon-btn" data-zoom="1.25" aria-label="Приблизить">+</button>
        <button class="icon-btn" data-zoom="0.8" aria-label="Отдалить">−</button>
    </div>
    <script>
        // класс из адреса (?class=wizard): сначала граф класса (data/<класс>/build/graph.js),
        // затем тексты всех его переводов (список — в meta.langs графа) и приложение
        (function () {
            var known = ['champion', 'wizard'];
            var cls = new URLSearchParams(location.search).get('class');
            if (known.indexOf(cls) < 0) cls = 'champion';
            var dir = 'data/' + cls + '/build/';
            function load(src, onload) {
                var s = document.createElement('script');
                s.src = src;
                s.async = false;
                if (onload) s.onload = onload;
                document.body.appendChild(s);
            }
            load(dir + 'graph.js', function () {
                var langs = (window.CLASS_DATA && window.CLASS_DATA.meta.langs) || [];
                langs.forEach(function (l) { load(dir + 'text-' + l.id + '.js'); });
                load('app.js');
            });
        })();
    </script>
</body>
</html>
